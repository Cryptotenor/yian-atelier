<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balloon Series | Yi-An Chen</title>
  <meta name="description" content="Balloon Series, 2026 by Yi-An Chen.">
  <style>
    :root {
      --background: #f7f4ee;
      --text: #111111;
      --muted: #5f5d58;
      --rule: #d8d3c9;
      --max-width: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      text-decoration: underline;
      text-underline-offset: 0.18em;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(247, 244, 238, 0.94);
      border-bottom: 1px solid var(--rule);
      backdrop-filter: blur(10px);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 22px 28px;
    }

    .brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 14px;
    }

    main {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 64px 28px 88px;
    }

    .page-intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 360px);
      gap: 28px;
      margin-bottom: 46px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--rule);
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 92px);
      font-weight: 400;
      line-height: 0.96;
      letter-spacing: 0;
    }

    .intro-text {
      align-self: end;
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .works-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 42px 24px;
    }

    .work {
      margin: 0;
    }

    .work img {
      display: block;
      width: 100%;
      height: auto;
      background: #e9e4dc;
    }

    .work figcaption {
      margin-top: 12px;
      font-size: 14px;
    }

    .work-title {
      display: block;
      font-weight: 700;
    }

    .work-series {
      display: block;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .works-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .page-intro {
        grid-template-columns: 1fr;
      }

      .intro-text {
        max-width: 520px;
      }
    }

    @media (max-width: 640px) {
      .nav {
        align-items: flex-start;
        flex-direction: column;
        gap: 14px;
        padding: 18px 20px;
      }

      .nav-links {
        flex-wrap: wrap;
        gap: 12px 18px;
      }

      main {
        padding: 44px 20px 64px;
      }

      .page-intro {
        margin-bottom: 34px;
      }

      .works-grid {
        grid-template-columns: 1fr;
        gap: 36px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Main navigation">
      <a class="brand" href="index.html">Yi-An Chen</a>
      <ul class="nav-links">
        <li><a href="works.html">Works</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="cv.html">CV</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="page-intro" aria-labelledby="page-title">
      <h1 id="page-title">Balloon Series</h1>
      <p class="intro-text">Selected works from Balloon Series, 2026.</p>
    </section>

    <section class="works-grid" aria-label="Balloon Series works">
      <figure class="work">
        <img src="pictures/balloon-series/works/Needle2.jpg" alt="Sewing the Sky" loading="lazy">
        <figcaption>
          <span class="work-title">Sewing the Sky</span>
          <span class="work-series">Balloon Series, 2026</span>
        </figcaption>
      </figure>

      <figure class="work">
        <img src="pictures/balloon-series/works/Door2.jpg" alt="Exit" loading="lazy">
        <figcaption>
          <span class="work-title">Exit</span>
          <span class="work-series">Balloon Series, 2026</span>
        </figcaption>
      </figure>

      <figure class="work">
        <img src="pictures/balloon-series/works/Gallery2.jpg" alt="The Interpreter" loading="lazy">
        <figcaption>
          <span class="work-title">The Interpreter</span>
          <span class="work-series">Balloon Series, 2026</span>
        </figcaption>
      </figure>

      <figure class="work">
        <img src="pictures/balloon-series/works/Boy2.jpg" alt="Reach" loading="lazy">
        <figcaption>
          <span class="work-title">Reach</span>
          <span class="work-series">Balloon Series, 2026</span>
        </figcaption>
      </figure>

      <figure class="work">
        <img src="pictures/balloon-series/works/Man2.jpg" alt="The Reader" loading="lazy">
        <figcaption>
          <span class="work-title">The Reader</span>
          <span class="work-series">Balloon Series, 2026</span>
        </figcaption>
      </figure>

      <figure class="work">
        <img src="pictures/balloon-series/works/Ballet2.jpg" alt="Ballet" loading="lazy">
        <figcaption>
          <span class="work-title">Ballet</span>
          <span class="work-series">Balloon Series, 2026</span>
        </figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
